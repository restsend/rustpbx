[env]
RUST_MIN_STACK = "536870912"
# sccache daemon spawns with a 50 GiB cache; the default 10 GiB thrashes on
# this workspace (dev artifacts alone are ~32 GiB).
SCCACHE_CACHE_SIZE = "50G"

[alias]
run-dev = "run --features commerce,wholesale,contact-center,addon-sbc --bin rustpbx -- --conf config.toml.dev"
test-dev = "test --features addon-cc,addon-sbc"
test-all = "test --features commerce,wholesale,contact-center,addon-sbc"
check-dev = "check --features commerce,wholesale,contact-center,addon-sbc"

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-no_compact_unwind"]
