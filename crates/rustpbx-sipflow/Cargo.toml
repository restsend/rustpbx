[package]
name = "rustpbx-sipflow"
version = "0.5.0"
edition = "2024"
description = "RustPBX component: sipflow"
license = "MIT"
repository = "https://github.com/restsend/rustpbx"

[dependencies]
anyhow = "1"
arc-swap = "1.9.2"
async-trait = "0.1.88"
audio-codec = "0.4.5"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
flate2 = "1"
futures = "0.3.31"
libc = "0.2"
lru = "0.18"
metrics = "0.24"
rand = "0.10"
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
] }
rustpbx-http-util = { path = "../rustpbx-http-util", version = "0.5.0" }
rustpbx-record-common = { path = "../rustpbx-record-common", version = "0.5.0" }
rustpbx-storage = { path = "../rustpbx-storage", version = "0.5.0" }
ruzstd = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "sqlite",
] }
tempfile = "3.27.0"
tokio = { version = "1.53", features = ["fs", "io-util", "net", "sync"] }
tokio-util = "0.7.18"
tracing = "0.1.43"

[dev-dependencies]
