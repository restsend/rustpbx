[package]
name = "rustpbx-storage"
version = "0.5.0"
edition = "2024"
description = "RustPBX component: storage"
license = "MIT"
repository = "https://github.com/restsend/rustpbx"

[dependencies]
anyhow = "1"
bytes = "1"
futures = "0.3.31"
object_store = { version = "0.14.0", default-features = false, features = [
    "fs",
    "aws-base",
    "azure-base",
    "gcp-base",
    "reqwest",
    "ring",
] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
