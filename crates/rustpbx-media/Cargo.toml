[package]
name = "rustpbx-media"
version = "0.4.13"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1.88"
audio-codec = "0.3.40"
bytes = { version = "1", features = ["serde"] }
dashmap = "6"
futures = "0.3.31"
minimp3 = "0.6.1"
parking_lot = "0.12"
rand = "0.10"
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
] }
rustpbx-http-util = { path = "../rustpbx-http-util" }
rustpbx-sipflow = { path = "../rustpbx-sipflow" }
rustrtc = "0.3.110"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["fs", "io-util", "sync"] }
tokio-util = "0.7.18"
tracing = "0.1.43"
uuid = { version = "1.23.3", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
criterion = "0.5"

[[bench]]
name = "transcode"
harness = false

[[bench]]
name = "mixer"
harness = false
