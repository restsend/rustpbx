[package]
name = "rustpbx-http-util"
version = "0.4.13"
edition = "2024"

[dependencies]
anyhow = "1"
bytes = "1"
futures = "0.3.31"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "stream",
    "rustls",
] }
serde_json = "1"
tokio = { version = "1.53", features = ["io-util"] }
