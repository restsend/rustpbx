[package]
name = "rustpbx-http-util"
version = "0.5.1"
edition = "2024"
description = "RustPBX component: http-util"
license = "MIT"
repository = "https://github.com/restsend/rustpbx"

[dependencies]
anyhow = "1"
bytes = "1"
futures = "0.3.31"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "stream",
    "multipart",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1.53", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
] }
