[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -v --tb=short --order-scope=session -m "not stress"
markers =
    tier1: core smoke tests
    tier2: full feature tests
    tier3: edge case tests
    trunk: trunk and SBC line access tests
    routing: call routing and business orchestration tests
    ivr: IVR native capability tests
    queue: queue and skill group tests
    acd: ACD strategy and distribution tests
    cc_phone: cc-phone widget and agent interaction tests
    presence: agent presence and state tests
    webhook: RWI webhook event verification tests
    transfer: call transfer tests (blind and consult)
    conference: conference and three-way tests
    cc_desk: cc-desk Chrome E2E (consult / WS resilience / takeover)
    supervisor: supervisor listen/whisper/barge tests
    slow: tests that take more than 30s
    stress: dispatch churn stress tests (agents online/offline + full-load + ACW; run explicitly with -m stress)
    integration: CRUD × call-flow integration with RWI↔webhook correlation
    acceptance: CSV functional checklist acceptance tests
    reports: reports / stats / metrics / CSAT endpoint coverage
    verification: real end-to-end capability verification (not just HTTP 200)
    desk_call_info_cti: Desk Call-Info / User-to-User + B-leg CTI resolution
    order: test execution order (requires pytest-order)
    scenario: declarative TOML workflow scenarios
